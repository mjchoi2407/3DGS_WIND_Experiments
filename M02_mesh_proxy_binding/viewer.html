<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M02 Mesh Proxy Binding Viewer</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #1b2430;
      --muted: #657181;
      --line: #d6dde5;
      --mesh: #68a7c9;
      --wire: #2c5d73;
      --anchor: #d15b2f;
      --vertex: #243447;
      --gaussian: #1f77b4;
      --accent: #2364aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 336px;
      min-height: 100vh;
    }

    .stage {
      position: relative;
      min-width: 0;
      background: #edf2f4;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100vh;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .hud {
      position: absolute;
      left: 16px;
      top: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(27, 36, 48, 0.12);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      font-size: 13px;
      color: var(--muted);
    }

    .hud strong {
      color: var(--ink);
      font-weight: 700;
    }

    aside {
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 18px 18px 20px;
      overflow-y: auto;
    }

    h1 {
      margin: 0 0 3px;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }

    .section:first-of-type {
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      border: 1px solid var(--line);
      padding: 9px 10px;
      min-height: 52px;
      background: #fbfcfd;
    }

    .stat .value {
      display: block;
      font-size: 18px;
      font-weight: 700;
    }

    .stat .label {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 11px;
    }

    label.check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      color: var(--ink);
    }

    select {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      background: #fbfcfd;
      color: var(--ink);
      padding: 0 9px;
      font: inherit;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
    }

    .control {
      display: grid;
      gap: 7px;
      margin: 11px 0;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    button {
      width: 100%;
      min-height: 34px;
      border: 1px solid #aac0d6;
      background: #eef5fb;
      color: #174268;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover {
      background: #e1eef8;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      word-break: break-word;
    }

    @media (max-width: 780px) {
      body {
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
      }

      canvas {
        height: 62vh;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="stage">
      <canvas id="view" width="1280" height="900"></canvas>
      <div class="hud"><strong>M02</strong><span id="hudName">loading</span></div>
    </main>
    <aside>
      <h1>Mesh Proxy Binding Viewer</h1>
      <p class="sub">triangulated cloth + sample Gaussian bindings</p>

      <div class="section">
        <h2>Asset</h2>
        <select id="assetSelect">
          <option value="cloth_10x10_cells">10x10 cloth</option>
          <option value="cloth_30x30_cells">30x30 cloth</option>
          <option value="cloth_50x50_cells">50x50 cloth</option>
        </select>
      </div>

      <div class="section">
        <h2>Mesh</h2>
        <div class="stats">
          <div class="stat"><span class="value" id="vertexCount">-</span><span class="label">vertices</span></div>
          <div class="stat"><span class="value" id="faceCount">-</span><span class="label">triangles</span></div>
          <div class="stat"><span class="value" id="edgeCount">-</span><span class="label">edges</span></div>
          <div class="stat"><span class="value" id="anchorCount">-</span><span class="label">anchors</span></div>
          <div class="stat"><span class="value" id="gaussianCount">-</span><span class="label">Gaussians</span></div>
          <div class="stat"><span class="value" id="samplesPerFace">-</span><span class="label">GS / tri</span></div>
        </div>
      </div>

      <div class="section">
        <h2>Display</h2>
        <label class="check">faces <input id="showFaces" type="checkbox" checked></label>
        <label class="check">wireframe <input id="showWire" type="checkbox" checked></label>
        <label class="check">vertices <input id="showVertices" type="checkbox"></label>
        <label class="check">anchors <input id="showAnchors" type="checkbox" checked></label>
        <label class="check">sample Gaussians <input id="showGaussians" type="checkbox" checked></label>
        <label class="check">GS anisotropic frames <input id="showGaussianFrames" type="checkbox" checked></label>
      </div>

      <div class="section">
        <h2>Deform</h2>
        <select id="deformation">
          <option value="sine">sine flutter</option>
          <option value="bend">bend</option>
          <option value="twist">twist</option>
          <option value="edge_flap">edge flap</option>
          <option value="compound">compound</option>
        </select>
        <label class="check">flutter preview <input id="animate" type="checkbox" checked></label>
        <div class="control">
          <div class="control-row"><span>amplitude</span><span id="ampValue">0.08</span></div>
          <input id="amplitude" type="range" min="0" max="0.18" step="0.005" value="0.08">
        </div>
        <div class="control">
          <div class="control-row"><span>frequency</span><span id="freqValue">1.60</span></div>
          <input id="frequency" type="range" min="0.4" max="4.0" step="0.05" value="1.6">
        </div>
        <button id="reset">reset view</button>
      </div>

      <div class="section">
        <h2>Loaded Files</h2>
        <div class="mono" id="meshPath">-</div>
        <div class="mono" id="gaussianPath">-</div>
      </div>
    </aside>
  </div>

  <script>
    const ASSETS = {
      cloth_10x10_cells: {
        label: "10x10 cloth",
        mesh: "assets/cloth_10x10_cells.js",
        gaussians: "assets/cloth_10x10_cells_gaussians.js"
      },
      cloth_30x30_cells: {
        label: "30x30 cloth",
        mesh: "assets/cloth_30x30_cells.js",
        gaussians: "assets/cloth_30x30_cells_gaussians.js"
      },
      cloth_50x50_cells: {
        label: "50x50 cloth",
        mesh: "assets/cloth_50x50_cells.js",
        gaussians: "assets/cloth_50x50_cells_gaussians.js"
      }
    };

    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    const controls = {
      assetSelect: document.getElementById("assetSelect"),
      showFaces: document.getElementById("showFaces"),
      showWire: document.getElementById("showWire"),
      showVertices: document.getElementById("showVertices"),
      showAnchors: document.getElementById("showAnchors"),
      showGaussians: document.getElementById("showGaussians"),
      showGaussianFrames: document.getElementById("showGaussianFrames"),
      deformation: document.getElementById("deformation"),
      animate: document.getElementById("animate"),
      amplitude: document.getElementById("amplitude"),
      frequency: document.getElementById("frequency"),
      reset: document.getElementById("reset"),
      ampValue: document.getElementById("ampValue"),
      freqValue: document.getElementById("freqValue")
    };

    const state = {
      yaw: -0.62,
      pitch: 0.72,
      zoom: 560,
      dragging: false,
      lastX: 0,
      lastY: 0,
      time: 0,
      meshName: null,
      mesh: null,
      gaussians: null,
      frameCoefficients: null,
      started: false
    };

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[data-src="${src}"]`);
        if (existing) {
          resolve();
          return;
        }
        const script = document.createElement("script");
        script.src = src;
        script.dataset.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`failed to load ${src}`));
        document.body.appendChild(script);
      });
    }

    async function loadAsset(name) {
      const asset = ASSETS[name];
      state.meshName = name;
      setText("hudName", "loading " + asset.label);
      setText("meshPath", asset.mesh);
      setText("gaussianPath", asset.gaussians);
      await loadScript(asset.mesh);
      await loadScript(asset.gaussians);
      state.mesh = window.WIND3DGS_MESH_ASSETS[name];
      state.gaussians = window.WIND3DGS_GAUSSIAN_ASSETS[name];
      if (!state.mesh || !state.gaussians) {
        setText("hudName", "missing asset");
        return;
      }
      prepareGaussianFrameCoefficients();
      updateStats();
      setText("hudName", state.mesh.metadata.name);
      if (!state.started) {
        state.started = true;
        requestAnimationFrame(render);
      }
    }

    function updateStats() {
      const mesh = state.mesh;
      const gaussians = state.gaussians;
      setText("vertexCount", mesh.vertices.length);
      setText("faceCount", mesh.faces.length);
      setText("edgeCount", mesh.edges.length);
      setText("anchorCount", mesh.anchors.filter(Boolean).length);
      setText("gaussianCount", gaussians.positions.length);
      setText("samplesPerFace", gaussians.metadata.samples_per_face);
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function add(a, b) {
      return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    }

    function sub(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function dot(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function mul(a, scale) {
      return [a[0] * scale, a[1] * scale, a[2] * scale];
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function normalize(a) {
      const length = Math.hypot(a[0], a[1], a[2]) || 1;
      return [a[0] / length, a[1] / length, a[2] / length];
    }

    function smoothstep(edge0, edge1, value) {
      const t = Math.max(0, Math.min(1, (value - edge0) / Math.max(1e-8, edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function deformedVertices(dt) {
      const mesh = state.mesh;
      const amp = Number(controls.amplitude.value);
      const freq = Number(controls.frequency.value);
      const mode = controls.deformation.value;
      return mesh.vertices.map((p, i) => {
        const u = mesh.uv[i][0];
        const v = mesh.uv[i][1];
        const anchorWeight = mesh.anchors[i] ? 0 : u;
        let x = p[0];
        let y = p[1];
        let z = p[2];

        if (mode === "bend") {
          const bendPhase = 0.62 + 0.38 * Math.sin((dt * 0.58 + 0.12) * Math.PI * 2);
          const curve = anchorWeight * anchorWeight;
          z += amp * 1.45 * curve * bendPhase;
          x -= amp * 0.22 * curve * bendPhase;
        } else if (mode === "twist") {
          const twistPhase = Math.sin((dt * 0.52 + 0.11) * Math.PI * 2);
          const angle = amp * 8.0 * anchorWeight * twistPhase;
          const c = Math.cos(angle);
          const s = Math.sin(angle);
          const yy = y;
          const zz = z;
          y = yy * c - zz * s;
          z = yy * s + zz * c;
        } else if (mode === "edge_flap") {
          const edgeWeight = smoothstep(0.22, 1.0, u);
          const phase = (dt * 0.82 + u * 0.18) * Math.PI * 2;
          z += amp * 1.25 * edgeWeight * Math.sin(phase);
          x += amp * 0.16 * edgeWeight * Math.cos(phase);
        } else if (mode === "compound") {
          const wave = Math.sin((u * freq + v * 0.25 + dt * 0.85) * Math.PI * 2);
          const bendPhase = 0.62 + 0.38 * Math.sin((dt * 0.45 + 0.18) * Math.PI * 2);
          const curve = anchorWeight * anchorWeight;
          z += amp * 0.58 * anchorWeight * wave;
          z += amp * 0.62 * curve * bendPhase;
          const twistPhase = Math.sin((dt * 0.50 + 0.07) * Math.PI * 2);
          const angle = amp * 3.8 * anchorWeight * twistPhase;
          const c = Math.cos(angle);
          const s = Math.sin(angle);
          const yy = y;
          const zz = z;
          y = yy * c - zz * s;
          z = yy * s + zz * c;
        } else {
          const wave = Math.sin((u * freq + v * 0.25 + dt * 0.85) * Math.PI * 2);
          z += amp * anchorWeight * wave;
        }

        return [x, y, z];
      });
    }

    function triangleFrame(vertices, face) {
      const p0 = vertices[face[0]];
      const p1 = vertices[face[1]];
      const p2 = vertices[face[2]];
      const tangent = normalize(sub(p1, p0));
      const normal = normalize(cross(sub(p1, p0), sub(p2, p0)));
      const bitangent = normalize(cross(normal, tangent));
      return [tangent, bitangent, normal];
    }

    function frameCoefficients(localFrame, triangleFrameAxes) {
      return localFrame.map(axis => triangleFrameAxes.map(basis => dot(axis, basis)));
    }

    function transportFrame(coefficients, triangleFrameAxes) {
      return coefficients.map(row => normalize(add(
        add(mul(triangleFrameAxes[0], row[0]), mul(triangleFrameAxes[1], row[1])),
        mul(triangleFrameAxes[2], row[2])
      )));
    }

    function prepareGaussianFrameCoefficients() {
      const mesh = state.mesh;
      const gaussians = state.gaussians;
      if (!mesh || !gaussians || !gaussians.local_frames) {
        state.frameCoefficients = null;
        return;
      }
      state.frameCoefficients = gaussians.triangle_ids.map((triangleId, i) => {
        const canonicalFrame = triangleFrame(mesh.vertices, mesh.faces[triangleId]);
        return frameCoefficients(gaussians.local_frames[i], canonicalFrame);
      });
    }

    function boundGaussianTransforms(vertices) {
      const mesh = state.mesh;
      const gaussians = state.gaussians;
      return gaussians.triangle_ids.map((triangleId, i) => {
        const face = mesh.faces[triangleId];
        const bary = gaussians.barycentric_coordinates[i];
        const offset = gaussians.local_offsets[i];
        const triangleFrameAxes = triangleFrame(vertices, face);
        const frame = state.frameCoefficients
          ? transportFrame(state.frameCoefficients[i], triangleFrameAxes)
          : triangleFrameAxes;
        let p = [0, 0, 0];
        for (let k = 0; k < 3; k++) {
          p = add(p, mul(vertices[face[k]], bary[k]));
        }
        p = add(p, mul(triangleFrameAxes[0], offset[0]));
        p = add(p, mul(triangleFrameAxes[1], offset[1]));
        p = add(p, mul(triangleFrameAxes[2], offset[2]));
        return {position: p, frame};
      });
    }

    function boundGaussianPositions(vertices) {
      return boundGaussianTransforms(vertices).map(item => item.position);
    }

    function rotate(p) {
      const cy = Math.cos(state.yaw);
      const sy = Math.sin(state.yaw);
      const cp = Math.cos(state.pitch);
      const sp = Math.sin(state.pitch);
      const x1 = p[0] * cy + p[2] * sy;
      const z1 = -p[0] * sy + p[2] * cy;
      const y2 = p[1] * cp - z1 * sp;
      const z2 = p[1] * sp + z1 * cp;
      return [x1, y2, z2];
    }

    function project(p, width, height) {
      const r = rotate(p);
      const perspective = 1 / (1 + r[2] * 0.55);
      return {
        x: width * 0.5 + r[0] * state.zoom * perspective,
        y: height * 0.53 - r[1] * state.zoom * perspective,
        z: r[2],
        perspective
      };
    }

    function drawAxes(width, height) {
      const origin = {x: 48, y: height - 46};
      const axes = [
        {p: [0.12, 0, 0], color: "#b4443f", label: "x"},
        {p: [0, 0.12, 0], color: "#43834a", label: "y"},
        {p: [0, 0, 0.12], color: "#345c9c", label: "z"}
      ];
      ctx.save();
      ctx.font = "12px system-ui";
      ctx.lineWidth = 2;
      axes.forEach(axis => {
        const r = rotate(axis.p);
        const end = {x: origin.x + r[0] * 120, y: origin.y - r[1] * 120};
        ctx.strokeStyle = axis.color;
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.fillStyle = axis.color;
        ctx.fillText(axis.label, end.x + 4, end.y + 4);
      });
      ctx.restore();
    }

    function drawBackground(width, height) {
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, "#f8fbfc");
      gradient.addColorStop(1, "#e4edf1");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function drawMesh(points) {
      const mesh = state.mesh;
      const faceOrder = mesh.faces.map((face, index) => {
        const z = (points[face[0]].z + points[face[1]].z + points[face[2]].z) / 3;
        return {index, z};
      }).sort((a, b) => a.z - b.z);

      if (controls.showFaces.checked) {
        for (const item of faceOrder) {
          const face = mesh.faces[item.index];
          const a = points[face[0]];
          const b = points[face[1]];
          const c = points[face[2]];
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
          ctx.closePath();
          ctx.fillStyle = "rgb(104, 167, 201)";
          ctx.fill();
        }
      }

      if (controls.showWire.checked) {
        ctx.strokeStyle = "rgba(44, 93, 115, 0.58)";
        ctx.lineWidth = state.mesh.metadata.cells >= 50 ? 0.7 : 1;
        for (const edge of mesh.edges) {
          const a = points[edge[0]];
          const b = points[edge[1]];
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }

      if (controls.showVertices.checked || controls.showAnchors.checked) {
        for (let i = 0; i < points.length; i++) {
          const anchor = mesh.anchors[i];
          if (!controls.showVertices.checked && !anchor) continue;
          if (!controls.showAnchors.checked && anchor) continue;
          const p = points[i];
          ctx.beginPath();
          ctx.arc(p.x, p.y, anchor ? 4.2 : 2.0, 0, Math.PI * 2);
          ctx.fillStyle = anchor ? "rgba(209, 91, 47, 0.96)" : "rgba(36, 52, 71, 0.76)";
          ctx.fill();
        }
      }
    }

    function drawGaussians(vertices, width, height) {
      if (!controls.showGaussians.checked || !state.gaussians) return;
      const gaussians = state.gaussians;
      const transforms = boundGaussianTransforms(vertices);
      const projected = transforms.map((transform, i) => {
        const screen = project(transform.position, width, height);
        return {screen, transform, index: i};
      }).sort((a, b) => a.screen.z - b.screen.z);
      const axisColors = ["rgba(199, 46, 38, 0.78)", "rgba(38, 143, 72, 0.78)", "rgba(47, 91, 204, 0.78)"];
      const frameStride = Math.max(1, Math.floor(projected.length / 1000));

      for (const item of projected) {
        const i = item.index;
        const p = item.screen;
        const transform = item.transform;
        const scale = gaussians.scales[i];
        const axis0 = project(add(transform.position, mul(transform.frame[0], scale[0] * 2.4)), width, height);
        const axis1 = project(add(transform.position, mul(transform.frame[1], scale[1] * 2.4)), width, height);
        const vx0 = axis0.x - p.x;
        const vy0 = axis0.y - p.y;
        const vx1 = axis1.x - p.x;
        const vy1 = axis1.y - p.y;
        const major = Math.max(1.1, Math.min(9.0, Math.hypot(vx0, vy0)));
        const minor = Math.max(0.8, Math.min(7.0, Math.hypot(vx1, vy1)));
        const angle = Math.atan2(vy0, vx0);
        const color = gaussians.colors[i];
        const alpha = Math.min(0.95, gaussians.opacity[i]);
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, major, minor, angle, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${Math.round(color[0] * 255)}, ${Math.round(color[1] * 255)}, ${Math.round(color[2] * 255)}, ${alpha})`;
        ctx.fill();

        if (controls.showGaussianFrames.checked && i % frameStride === 0) {
          ctx.save();
          ctx.lineWidth = 1.15;
          for (let axis = 0; axis < 3; axis++) {
            const end = project(add(transform.position, mul(transform.frame[axis], scale[axis] * 4.0)), width, height);
            ctx.strokeStyle = axisColors[axis];
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
          }
          ctx.restore();
        }
      }
    }

    function render(timestamp) {
      if (!state.mesh) {
        requestAnimationFrame(render);
        return;
      }
      if (controls.animate.checked) state.time = timestamp / 1000;
      controls.ampValue.textContent = Number(controls.amplitude.value).toFixed(3);
      controls.freqValue.textContent = Number(controls.frequency.value).toFixed(2);

      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      ctx.clearRect(0, 0, width, height);
      drawBackground(width, height);

      const vertices = deformedVertices(state.time);
      const points = vertices.map(p => project(p, width, height));
      drawMesh(points);
      drawGaussians(vertices, width, height);
      drawAxes(width, height);
      requestAnimationFrame(render);
    }

    function resetView() {
      state.yaw = -0.62;
      state.pitch = 0.72;
      state.zoom = 560;
    }

    canvas.addEventListener("pointerdown", event => {
      state.dragging = true;
      state.lastX = event.clientX;
      state.lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", event => {
      if (!state.dragging) return;
      const dx = event.clientX - state.lastX;
      const dy = event.clientY - state.lastY;
      state.lastX = event.clientX;
      state.lastY = event.clientY;
      state.yaw += dx * 0.008;
      state.pitch = Math.max(-1.35, Math.min(1.35, state.pitch + dy * 0.008));
    });

    canvas.addEventListener("pointerup", event => {
      state.dragging = false;
      canvas.releasePointerCapture(event.pointerId);
    });

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      const scale = Math.exp(-event.deltaY * 0.001);
      state.zoom = Math.max(180, Math.min(1600, state.zoom * scale));
    }, {passive: false});

    controls.assetSelect.addEventListener("change", event => loadAsset(event.target.value));
    controls.reset.addEventListener("click", resetView);
    window.addEventListener("resize", resize);

    resize();
    loadAsset(controls.assetSelect.value).catch(error => {
      setText("hudName", error.message);
      console.error(error);
    });
  </script>
</body>
</html>
